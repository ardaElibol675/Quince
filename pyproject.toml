[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quince"
version = "0.1.0"
description = "Offline file converter and file toolbox for Linux with a drag-and-tap radial wheel"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Arda Elibol" }]
dependencies = [
    "PySide6>=6.7,<6.11",
    "Pillow>=11.2",
    "pillow-heif>=0.18",
    "pypdf>=5.0",
    "PyMuPDF>=1.24",
    "pysubs2>=1.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
quince = "quince.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plugins are loaded explicitly so foreign plugins on PYTHONPATH (e.g. ROS) cannot break runs.
addopts = "-ra --disable-plugin-autoload -p pytestqt.plugin"
qt_api = "pyside6"
markers = [
    "integration: needs external binaries or generated fixtures",
]
